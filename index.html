<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>上班打卡</title>
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="打卡">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root {
    --bg: #f4f6fb;
    --card: #ffffff;
    --text: #1f2937;
    --muted: #6b7280;
    --line: #e5e7eb;
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --danger: #dc2626;
    --ok: #16a34a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --line: #334155;
      --primary: #3b82f6;
      --primary-dark: #2563eb;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    padding: env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom));
    max-width: 520px; margin: 0 auto;
  }
  header { text-align: center; padding: 20px 0 4px; }
  #today { font-size: 15px; color: var(--muted); }
  #clock { font-size: 40px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: 1px; }

  .punch-wrap { display: flex; flex-direction: column; align-items: center; padding: 20px 0 12px; }
  #punch {
    width: 200px; height: 200px; border-radius: 50%;
    border: none; background: var(--primary); color: #fff;
    font-size: 28px; font-weight: 700; letter-spacing: 2px;
    box-shadow: 0 10px 30px rgba(37, 99, 235, .35);
    cursor: pointer; transition: transform .1s, background .2s;
    font-family: inherit;
  }
  #punch:active { transform: scale(.95); background: var(--primary-dark); }
  #punch.out { background: #ea580c; box-shadow: 0 10px 30px rgba(234, 88, 12, .35); }
  #punch.out:active { background: #c2410c; }
  #punch.done { background: var(--ok); box-shadow: 0 10px 30px rgba(22, 163, 74, .35); }
  #status {
    margin-top: 14px; min-height: 22px; font-size: 16px; color: var(--muted); text-align: center;
    white-space: pre-line; line-height: 1.6;
  }
  .row .time .kind { font-size: 12px; font-weight: normal; color: var(--muted); margin-right: 6px; }

  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 8px 0 20px; }
  .stat { background: var(--card); border-radius: 14px; padding: 14px; text-align: center; }
  .stat .label { font-size: 14px; color: var(--muted); }
  .stat .value { font-size: 30px; font-weight: 700; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .stat .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .stat.wide { grid-column: 1 / -1; }
  .stat.warn .value { color: #d97706; }
  .stat.danger { box-shadow: inset 0 0 0 2px var(--danger); }
  .stat.danger .value, .stat.danger .sub { color: var(--danger); }

  h2 { font-size: 17px; margin: 0 0 8px; display: flex; justify-content: space-between; align-items: baseline; }
  h2 small { font-weight: normal; color: var(--muted); font-size: 13px; }
  .list { background: var(--card); border-radius: 14px; overflow: hidden; }
  .row { display: flex; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: none; }
  .row .date { flex: 1; }
  .row .date .wd { color: var(--muted); font-size: 13px; margin-left: 6px; }
  .row .time { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .row .extra { font-size: 12px; color: var(--muted); margin-left: 8px; }
  .row .time.late, .row .extra.late { color: var(--danger); }
  .link-btn {
    display: block; margin: 4px auto 0; border: none; background: none; color: var(--muted);
    font-size: 14px; text-decoration: underline; padding: 8px; cursor: pointer; font-family: inherit;
  }
  .row .del {
    margin-left: 10px; border: none; background: none; color: var(--muted);
    font-size: 20px; width: 36px; height: 36px; border-radius: 8px; cursor: pointer;
  }
  .row .del:active { background: var(--line); color: var(--danger); }
  .empty { padding: 28px; text-align: center; color: var(--muted); }

  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
  .btn {
    border: 1px solid var(--line); background: var(--card); color: var(--text);
    font-size: 16px; padding: 14px; border-radius: 12px; cursor: pointer; font-family: inherit;
  }
  .btn:active { background: var(--line); }
  .note { font-size: 12px; color: var(--muted); text-align: center; margin-top: 14px; line-height: 1.6; }

  #toast {
    position: fixed; left: 50%; bottom: calc(30px + env(safe-area-inset-bottom));
    transform: translateX(-50%) translateY(20px); opacity: 0;
    background: rgba(17, 24, 39, .92); color: #fff; padding: 12px 20px; border-radius: 999px;
    font-size: 15px; transition: all .25s; pointer-events: none; white-space: nowrap;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .sub-btns { display: flex; gap: 10px; margin-top: 12px; }
  .sub-btns button {
    border: 1px solid var(--line); background: var(--card); color: var(--text);
    font-size: 15px; padding: 10px 22px; border-radius: 999px; cursor: pointer; font-family: inherit;
  }
  .sub-btns button:active { background: var(--line); }
  .tag {
    font-size: 14px; font-weight: 600; color: #b45309; background: #fef3c7;
    padding: 4px 10px; border-radius: 999px;
  }
  @media (prefers-color-scheme: dark) { .tag { color: #fcd34d; background: #422006; } }

  .cal { background: var(--card); border-radius: 14px; padding: 12px; margin-bottom: 20px; }
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .cal-head h2 { margin: 0; font-size: 17px; }
  .cal-nav {
    width: 44px; height: 40px; border: none; background: none; color: var(--text);
    font-size: 26px; border-radius: 10px; cursor: pointer; font-family: inherit;
  }
  .cal-nav:active { background: var(--line); }
  .cal-nav:disabled { opacity: .25; cursor: default; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-wd { text-align: center; font-size: 12px; color: var(--muted); padding: 2px 0 4px; }
  .cal-day {
    min-width: 0; height: 52px; border: none; border-radius: 8px; background: var(--bg); color: var(--text);
    font-family: inherit; padding: 6px 0 0; display: flex; flex-direction: column; align-items: center; gap: 2px;
    cursor: pointer;
  }
  .cal-day .n { font-size: 14px; font-weight: 600; }
  .cal-day .t { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .cal-day.blank { background: none; cursor: default; }
  .cal-day.weekend .n { color: var(--muted); }
  .cal-day.future { opacity: .4; }
  .cal-day.late { background: #fee2e2; }
  .cal-day.late .t { color: var(--danger); font-weight: 600; }
  .cal-day.leave { background: #fef3c7; }
  .cal-day.leave .t { color: #b45309; }
  .cal-day.miss { box-shadow: inset 0 0 0 2px #ea580c; }
  .cal-day.today .n { color: var(--primary); }
  .cal-day.today { box-shadow: inset 0 0 0 2px var(--primary); }
  .cal-day.sel { box-shadow: inset 0 0 0 2px var(--text); }
  @media (prefers-color-scheme: dark) {
    .cal-day.late { background: #450a0a; }
    .cal-day.leave { background: #422006; }
    .cal-day.leave .t { color: #fcd34d; }
  }
  .cal-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; justify-content: center; font-size: 12px; color: var(--muted); margin-top: 10px; }
  .lg { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
  .lg.late { background: #fca5a5; }
  .lg.leave { background: #fcd34d; }
  .lg.miss { box-shadow: inset 0 0 0 2px #ea580c; }
  .cal-sum { text-align: center; font-size: 13px; color: var(--muted); margin-top: 6px; }
  .cal-detail { margin-top: 10px; padding: 12px 14px; border-radius: 10px; background: var(--bg); font-size: 15px; line-height: 1.7; }
  .cal-detail b { font-size: 16px; }
  .cal-detail .late { color: var(--danger); }
  .cal-detail .btn { display: block; width: 100%; margin-top: 8px; padding: 10px; }
  .row.leave .date { color: var(--muted); }

  dialog {
    border: none; border-radius: 18px; padding: 20px; width: min(340px, calc(100vw - 32px));
    background: var(--card); color: var(--text);
  }
  dialog::backdrop { background: rgba(0, 0, 0, .45); }
  dialog h3 { margin: 0 0 16px; font-size: 19px; text-align: center; }
  dialog input[type=date], dialog input[type=time], dialog input[type=number] {
    display: block; width: 100%; margin-top: 6px; font-size: 17px; padding: 10px;
    border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--text); font-family: inherit;
  }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 16px 0 8px; }
  .seg.two { grid-template-columns: 1fr 1fr; margin-top: 0; }
  .seg input { display: none; }
  .seg span {
    display: block; text-align: center; padding: 12px 0; font-size: 16px; border-radius: 10px;
    border: 1px solid var(--line); cursor: pointer;
  }
  .seg input:checked + span { background: var(--primary); border-color: var(--primary); color: #fff; }
  .hint { font-size: 13px; color: var(--muted); margin: 8px 0 16px; line-height: 1.5; }
  .dlg-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  dialog label + label { display: block; margin-top: 12px; }
</style>
</head>
<body>
  <header>
    <div id="today"></div>
    <div id="clock">--:--:--</div>
  </header>

  <div class="punch-wrap">
    <button id="punch" type="button">到達公司</button>
    <div id="status"></div>
    <div class="sub-btns">
      <button id="manualBtn" type="button">手動打卡</button>
      <button id="leaveBtn" type="button">請假登記</button>
    </div>
  </div>

  <dialog id="manualDlg">
    <form method="dialog">
      <h3>手動打卡</h3>
      <div class="seg two">
        <label><input type="radio" name="mk" value="in" checked><span>上班</span></label>
        <label><input type="radio" name="mk" value="out"><span>下班</span></label>
      </div>
      <label>日期<input type="date" id="manualDate" required></label>
      <label>時間<input type="time" id="manualTime" required></label>
      <p class="hint">忘記打卡時用來補登，列表中會標示「手動」。<br>同一天的下班時間只會留一筆，補登會取代原本的。</p>
      <div class="dlg-actions">
        <button class="btn" value="cancel" formnovalidate>取消</button>
        <button class="btn primary" value="ok" autofocus>確定</button>
      </div>
    </form>
  </dialog>

  <dialog id="leaveDlg">
    <form method="dialog">
      <h3>請假登記</h3>
      <label>日期<input type="date" id="leaveDate" required></label>
      <div class="seg">
        <label><input type="radio" name="lt" value="full" checked><span>全天</span></label>
        <label><input type="radio" name="lt" value="am"><span>上午</span></label>
        <label><input type="radio" name="lt" value="pm"><span>下午</span></label>
      </div>
      <p class="hint">全天或上午請假的日子，不列入平均到達時間。<br>同一天重複登記會覆蓋原本的假別。</p>
      <div class="dlg-actions">
        <button class="btn" value="cancel" formnovalidate>取消</button>
        <button class="btn primary" value="ok" autofocus>確定</button>
      </div>
    </form>
  </dialog>

  <section class="stats">
    <div class="stat">
      <div class="label">本週平均</div>
      <div class="value" id="avgWeek">--:--</div>
      <div class="sub" id="cntWeek"></div>
    </div>
    <div class="stat">
      <div class="label">本月平均</div>
      <div class="value" id="avgMonth">--:--</div>
      <div class="sub" id="cntMonth"></div>
    </div>
    <div class="stat wide" id="lateCard">
      <div class="label" id="lateLabel">本月遲到</div>
      <div class="value" id="lateCount">0</div>
      <div class="sub" id="lateSub"></div>
    </div>
  </section>

  <section class="cal">
    <div class="cal-head">
      <button class="cal-nav" id="calPrev" type="button" aria-label="上個月">‹</button>
      <h2 id="calTitle"></h2>
      <button class="cal-nav" id="calNext" type="button" aria-label="下個月">›</button>
    </div>
    <div class="cal-grid" id="calGrid"></div>
    <div class="cal-legend">
      <span><i class="lg late"></i>遲到</span>
      <span><i class="lg leave"></i>請假</span>
      <span><i class="lg miss"></i>沒打下班卡</span>
    </div>
    <div class="cal-sum" id="calSum"></div>
    <div class="cal-detail" id="calDetail" hidden></div>
  </section>

  <section>
    <h2>最近 30 天紀錄 <small id="cnt30"></small></h2>
    <div class="list" id="list"></div>
  </section>

  <div class="actions">
    <button class="btn" id="exportBtn" type="button">匯出 CSV</button>
    <button class="btn" id="importBtn" type="button">匯入 CSV</button>
  </div>
  <input type="file" id="importFile" accept=".csv,text/csv" hidden>
  <p class="note">資料只存在這支手機的瀏覽器中。<br>清除瀏覽器資料會一併刪除，請定期匯出備份。</p>
  <button class="link-btn" id="settingsBtn" type="button">設定上下班規則</button>

  <dialog id="settingsDlg">
    <form method="dialog">
      <h3>上下班規則</h3>
      <label>幾點起算遲到（含）<input type="time" id="setLateTime" required></label>
      <label>每月幾次會收到通知<input type="number" id="setLateLimit" min="1" max="31" inputmode="numeric" required></label>
      <label>每天工時（小時）<input type="number" id="setWorkHours" min="1" max="24" step="0.5" inputmode="decimal" required></label>
      <label>午休（分鐘）<input type="number" id="setLunchMins" min="0" max="180" step="5" inputmode="numeric" required></label>
      <p class="hint">09:00 整就算遲到，08:59 以前準時；有請假的日子都不算遲到。<br>最早下班＝上班時間＋工時＋午休。半天假那天只需一半工時，不扣午休。</p>
      <div class="dlg-actions">
        <button class="btn" value="cancel" formnovalidate>取消</button>
        <button class="btn primary" value="ok">儲存</button>
      </div>
    </form>
  </dialog>

  <div id="toast"></div>

<script>
(function () {
  const KEY = 'punch-records-v1';
  const WD = ['日', '一', '二', '三', '四', '五', '六'];
  const $ = (id) => document.getElementById(id);
  const pad = (n) => String(n).padStart(2, '0');

  // 每筆紀錄為 ISO 時間字串
  function load() {
    try {
      const arr = JSON.parse(localStorage.getItem(KEY) || '[]');
      return Array.isArray(arr) ? arr.filter((s) => !isNaN(new Date(s))) : [];
    } catch (e) { return []; }
  }
  function save(arr) {
    arr.sort();
    localStorage.setItem(KEY, JSON.stringify(arr));
  }

  // 請假紀錄：{ 'YYYY-MM-DD': 'full' | 'am' | 'pm' }
  const LEAVE_KEY = 'punch-leaves-v1';
  const LEAVE_LABEL = { full: '全天', am: '上午', pm: '下午' };
  function loadLeaves() {
    try {
      const obj = JSON.parse(localStorage.getItem(LEAVE_KEY) || '{}');
      return obj && typeof obj === 'object' && !Array.isArray(obj) ? obj : {};
    } catch (e) { return {}; }
  }
  function saveLeaves(obj) {
    localStorage.setItem(LEAVE_KEY, JSON.stringify(obj));
  }
  // 全天或上午請假，當天到達時間不算進平均
  const skipsAvg = (type) => type === 'full' || type === 'am';

  // 手動補登的打卡（ISO 時間字串），只用來在列表與 CSV 標示
  const MANUAL_KEY = 'punch-manual-v1';
  function loadManual() {
    try {
      const arr = JSON.parse(localStorage.getItem(MANUAL_KEY) || '[]');
      return new Set(Array.isArray(arr) ? arr : []);
    } catch (e) { return new Set(); }
  }
  function saveManual(set) {
    localStorage.setItem(MANUAL_KEY, JSON.stringify([...set]));
  }

  // 遲到規則：lateTime（含）起算遲到，每月 lateLimit 次會收到公司通知
  const SETTINGS_KEY = 'punch-settings-v1';
  const DEFAULT_SETTINGS = { lateTime: '09:00', lateLimit: 5, workHours: 8, lunchMins: 60 };
  function loadSettings() {
    try {
      return { ...DEFAULT_SETTINGS, ...JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}') };
    } catch (e) { return { ...DEFAULT_SETTINGS }; }
  }
  function saveSettings(cfg) {
    localStorage.setItem(SETTINGS_KEY, JSON.stringify(cfg));
  }
  // 當天第一筆打卡在設定時間（含）之後算遲到；有請假（全天、上午、下午）的日子都不算
  const isLateDay = (k, first, leaves, cfg) => !!first && !leaves[k] && hm(first) >= cfg.lateTime;
  const monthLates = (days, leaves, cfg, ym) =>
    [...days.entries()].filter(([k, d]) => k.startsWith(ym) && isLateDay(k, d, leaves, cfg)).length;

  // 下班紀錄：{ 'YYYY-MM-DD': ISO 時間字串 }，每天一筆
  const OUT_KEY = 'punch-out-v1';
  function loadOuts() {
    try {
      const obj = JSON.parse(localStorage.getItem(OUT_KEY) || '{}');
      return obj && typeof obj === 'object' && !Array.isArray(obj) ? obj : {};
    } catch (e) { return {}; }
  }
  function saveOuts(obj) {
    localStorage.setItem(OUT_KEY, JSON.stringify(obj));
  }
  // 當天應上班分鐘數與要扣的午休：半天假只需一半工時、不扣午休
  function workRule(leaveType, cfg) {
    const half = leaveType === 'am' || leaveType === 'pm';
    return { work: cfg.workHours * 60 / (half ? 2 : 1), lunch: half ? 0 : cfg.lunchMins };
  }
  const earliestOff = (first, leaveType, cfg) => {
    const r = workRule(leaveType, cfg);
    return new Date(first.getTime() + (r.work + r.lunch) * 60000);
  };
  const workedMins = (first, out, leaveType, cfg) =>
    Math.max(0, Math.floor((out - first) / 60000) - workRule(leaveType, cfg).lunch);
  const dur = (m) => `${Math.floor(Math.abs(m) / 60)}:${pad(Math.abs(m) % 60)}`;

  const dateKey = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const hm = (d) => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  const hms = (d) => `${hm(d)}:${pad(d.getSeconds())}`;
  const minsToHM = (m) => `${pad(Math.floor(m / 60))}:${pad(Math.round(m % 60) === 60 ? 59 : Math.round(m % 60))}`;

  // 每天只取最早的一筆當作「到達時間」
  function firstPerDay(records) {
    const map = new Map();
    for (const s of records) {
      const d = new Date(s);
      const k = dateKey(d);
      if (!map.has(k) || d < map.get(k)) map.set(k, d);
    }
    return map;
  }

  // 統計 [start, end) 區間：到達平均（排除全天/上午請假）與請假天數
  function stats(days, leaves, start, end) {
    const from = dateKey(start), to = dateKey(end);
    const list = [...days.entries()]
      .filter(([k]) => k >= from && k < to && !skipsAvg(leaves[k]))
      .map(([, d]) => d);
    const leaveDays = Object.entries(leaves)
      .filter(([k]) => k >= from && k < to)
      .reduce((n, [, t]) => n + (t === 'full' ? 1 : 0.5), 0);
    const total = list.reduce((sum, d) => sum + d.getHours() * 60 + d.getMinutes() + d.getSeconds() / 60, 0);
    return { avg: list.length ? total / list.length : null, count: list.length, leaveDays };
  }

  function showStats(avgId, cntId, s) {
    $(avgId).textContent = s.avg == null ? '--:--' : minsToHM(s.avg);
    const parts = [];
    if (s.count) parts.push(`共 ${s.count} 天`);
    if (s.leaveDays) parts.push(`請假 ${s.leaveDays} 天`);
    $(cntId).textContent = parts.length ? parts.join('・') : '尚無紀錄';
  }

  function render() {
    const records = load();
    const leaves = loadLeaves();
    const manual = loadManual();
    const days = firstPerDay(records);
    const now = new Date();

    // 本週（週一開始）與本月
    const weekStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    weekStart.setDate(weekStart.getDate() - ((weekStart.getDay() + 6) % 7));
    const weekEnd = new Date(weekStart.getFullYear(), weekStart.getMonth(), weekStart.getDate() + 7);
    const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
    const monthEnd = new Date(now.getFullYear(), now.getMonth() + 1, 1);
    showStats('avgWeek', 'cntWeek', stats(days, leaves, weekStart, weekEnd));
    showStats('avgMonth', 'cntMonth', stats(days, leaves, monthStart, monthEnd));

    // 本月遲到次數
    const cfg = loadSettings();
    const todayKey = dateKey(now);
    const lateN = monthLates(days, leaves, cfg, todayKey.slice(0, 7));
    const left = cfg.lateLimit - lateN;
    $('lateLabel').textContent = `本月遲到（${cfg.lateTime} 起算）`;
    $('lateCount').textContent = `${lateN} / ${cfg.lateLimit} 次`;
    $('lateSub').textContent = left > 0 ? `再遲到 ${left} 次會收到通知` : '已達通知門檻';
    $('lateCard').classList.toggle('warn', left > 0 && left <= 2);
    $('lateCard').classList.toggle('danger', left <= 0);

    // 今日狀態：大按鈕依序為 到達公司 → 下班打卡 → 已下班
    const outs = loadOuts();
    const todayFirst = days.get(todayKey);
    const todayOut = outs[todayKey] ? new Date(outs[todayKey]) : null;
    const todayLeave = leaves[todayKey];
    const btn = $('punch');
    btn.textContent = !todayFirst ? '到達公司' : !todayOut ? '下班打卡' : '已下班';
    btn.classList.toggle('out', !!todayFirst && !todayOut);
    btn.classList.toggle('done', !!todayFirst && !!todayOut);
    let status;
    if (!todayFirst) {
      status = todayLeave === 'full' ? '今天請假（全天）' : '今天尚未打卡';
      if (todayLeave && todayLeave !== 'full') status += `（${LEAVE_LABEL[todayLeave]}請假）`;
    } else {
      status = `上班 ${hm(todayFirst)}`;
      if (todayLeave) status += `（${LEAVE_LABEL[todayLeave]}請假）`;
      if (isLateDay(todayKey, todayFirst, leaves, cfg)) status += '・遲到';
      if (!todayOut) {
        status += `\n最早可下班 ${hm(earliestOff(todayFirst, todayLeave, cfg))}`;
      } else {
        const w = workedMins(todayFirst, todayOut, todayLeave, cfg);
        const short = workRule(todayLeave, cfg).work - w;
        status += ` → 下班 ${hm(todayOut)}\n工時 ${dur(w)}${short > 0 ? `・不足 ${dur(short)}` : ' ✓'}`;
      }
    }
    $('status').textContent = status;

    renderCalendar({ days, leaves, outs, cfg, todayKey });

    // 最近 30 天：打卡與請假合併，依日期新到舊（同一天請假列在打卡上方）
    const cutoff = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 29);
    const cutoffKey = dateKey(cutoff);
    const items = [];
    for (const s of records) {
      const d = new Date(s);
      if (d >= cutoff) items.push({ sort: `${dateKey(d)} ${hms(d)}`, punch: s, d });
    }
    for (const [k, t] of Object.entries(leaves)) {
      if (k >= cutoffKey) items.push({ sort: `${k} 99`, leave: k, type: t });
    }
    for (const [k, s] of Object.entries(outs)) {
      const d = new Date(s);
      if (k >= cutoffKey) items.push({ sort: `${k} ${hms(d)}`, out: k, iso: s, d });
    }
    items.sort((a, b) => (a.sort < b.sort ? 1 : -1));

    const nPunch = items.filter((i) => i.punch || i.out).length;
    const nLeave = items.length - nPunch;
    $('cnt30').textContent = [nPunch && `打卡 ${nPunch} 筆`, nLeave && `請假 ${nLeave} 筆`].filter(Boolean).join('・');
    const list = $('list');
    list.innerHTML = '';
    if (!items.length) {
      list.innerHTML = '<div class="empty">還沒有打卡紀錄</div>';
      return;
    }
    for (const item of items) {
      const row = document.createElement('div');
      let onDelete;
      if (item.leave) {
        const d = new Date(item.leave + 'T00:00');
        row.className = 'row leave';
        row.innerHTML =
          `<div class="date">${d.getMonth() + 1}/${d.getDate()}<span class="wd">週${WD[d.getDay()]}</span></div>` +
          `<span class="tag">請假・${LEAVE_LABEL[item.type]}</span>`;
        onDelete = () => {
          if (!confirm(`確定刪除 ${item.leave} 的請假紀錄？`)) return false;
          const lv = loadLeaves();
          delete lv[item.leave];
          saveLeaves(lv);
          return true;
        };
      } else if (item.out) {
        const d = item.d;
        const k = item.out;
        const first = days.get(k);
        let note = '', short = false;
        if (first) {
          const w = workedMins(first, d, leaves[k], cfg);
          const lack = workRule(leaves[k], cfg).work - w;
          short = lack > 0;
          note = short ? `不足 ${dur(lack)}` : `工時 ${dur(w)}`;
        }
        if (manual.has(item.iso)) note = note ? `手動・${note}` : '手動';
        row.className = 'row';
        row.innerHTML =
          `<div class="date">${d.getMonth() + 1}/${d.getDate()}<span class="wd">週${WD[d.getDay()]}</span></div>` +
          `<div class="time"><span class="kind">下班</span>${hm(d)}</div>` +
          (note ? `<span class="extra${short ? ' late' : ''}">${note}</span>` : '');
        onDelete = () => {
          if (!confirm(`確定刪除 ${k} ${hm(d)} 的下班紀錄？`)) return false;
          const o = loadOuts();
          delete o[k];
          saveOuts(o);
          const m = loadManual();
          if (m.delete(item.iso)) saveManual(m);
          return true;
        };
      } else {
        const d = item.d;
        const k = dateKey(d);
        const isFirst = days.get(k).getTime() === d.getTime();
        const late = isFirst && isLateDay(k, d, leaves, cfg);
        const note = [manual.has(item.punch) && '手動', !isFirst ? '重複' : skipsAvg(leaves[k]) && '不計平均']
          .filter(Boolean).join('・');
        row.className = 'row';
        row.innerHTML =
          `<div class="date">${d.getMonth() + 1}/${d.getDate()}<span class="wd">週${WD[d.getDay()]}</span></div>` +
          `<div class="time${late ? ' late' : ''}"><span class="kind">上班</span>${hm(d)}</div>` +
          (late ? '<span class="extra late">遲到</span>' : '') +
          (note ? `<span class="extra">${note}</span>` : '');
        onDelete = () => {
          if (!confirm(`確定刪除 ${k} ${hm(d)} 這筆紀錄？`)) return false;
          save(load().filter((x) => x !== item.punch));
          const m = loadManual();
          if (m.delete(item.punch)) saveManual(m);
          return true;
        };
      }
      const del = document.createElement('button');
      del.className = 'del';
      del.type = 'button';
      del.setAttribute('aria-label', '刪除');
      del.textContent = '×';
      del.addEventListener('click', () => {
        if (onDelete()) { render(); toast('已刪除'); }
      });
      row.appendChild(del);
      list.appendChild(row);
    }
  }

  // 月曆：calMonth 為顯示月份的 1 號，calSel 為點選的日期
  let calMonth = null;
  let calSel = null;
  let calCtx = null;
  const LEAVE_SHORT = { full: '請假', am: '上午假', pm: '下午假' };

  function renderCalendar(ctx) {
    calCtx = ctx;
    const { days, leaves, outs, cfg, todayKey } = ctx;
    const now = new Date();
    const thisMonth = new Date(now.getFullYear(), now.getMonth(), 1);
    if (!calMonth) calMonth = thisMonth;
    const y = calMonth.getFullYear(), mo = calMonth.getMonth();
    const ym = `${y}-${pad(mo + 1)}`;
    $('calTitle').textContent = `${y} 年 ${mo + 1} 月`;
    $('calNext').disabled = calMonth >= thisMonth;

    const grid = $('calGrid');
    grid.innerHTML = '';
    for (const w of ['一', '二', '三', '四', '五', '六', '日']) {
      const el = document.createElement('div');
      el.className = 'cal-wd';
      el.textContent = w;
      grid.appendChild(el);
    }
    const lead = (new Date(y, mo, 1).getDay() + 6) % 7;
    for (let i = 0; i < lead; i++) {
      const el = document.createElement('div');
      el.className = 'cal-day blank';
      grid.appendChild(el);
    }
    const nDays = new Date(y, mo + 1, 0).getDate();
    for (let day = 1; day <= nDays; day++) {
      const d = new Date(y, mo, day);
      const k = dateKey(d);
      const first = days.get(k);
      const lv = leaves[k];
      const cls = ['cal-day'];
      if (d.getDay() === 0 || d.getDay() === 6) cls.push('weekend');
      if (k > todayKey) cls.push('future');
      if (lv) cls.push('leave');
      if (isLateDay(k, first, leaves, cfg)) cls.push('late');
      if (first && !outs[k] && k < todayKey) cls.push('miss');
      if (k === todayKey) cls.push('today');
      if (k === calSel) cls.push('sel');
      const cell = document.createElement('button');
      cell.type = 'button';
      cell.className = cls.join(' ');
      cell.innerHTML = `<span class="n">${day}</span><span class="t">${first ? hm(first) : lv ? LEAVE_SHORT[lv] : ''}</span>`;
      cell.addEventListener('click', () => {
        calSel = calSel === k ? null : k;
        renderCalendar(calCtx);
      });
      grid.appendChild(cell);
    }

    // 該月摘要
    const s = stats(days, leaves, new Date(y, mo, 1), new Date(y, mo + 1, 1));
    const workDays = [...days.keys()].filter((k) => k.startsWith(ym)).length;
    const parts = [`出勤 ${workDays} 天`, `遲到 ${monthLates(days, leaves, cfg, ym)} 次`];
    if (s.leaveDays) parts.push(`請假 ${s.leaveDays} 天`);
    if (s.avg != null) parts.push(`平均 ${minsToHM(s.avg)}`);
    $('calSum').textContent = parts.join('・');

    // 點選日期的明細
    const box = $('calDetail');
    if (!calSel || !calSel.startsWith(ym)) { box.hidden = true; return; }
    const k = calSel;
    const d = new Date(k + 'T00:00');
    const first = days.get(k);
    const out = outs[k] ? new Date(outs[k]) : null;
    const lv = leaves[k];
    const lines = [`<b>${d.getMonth() + 1}/${d.getDate()}（${WD[d.getDay()]}）</b>`];
    if (lv) lines.push(`請假：${LEAVE_LABEL[lv]}`);
    if (first) lines.push(`上班 ${hm(first)}${isLateDay(k, first, leaves, cfg) ? '　<span class="late">遲到</span>' : ''}`);
    if (out) {
      let line = `下班 ${hm(out)}`;
      if (first) {
        const w = workedMins(first, out, lv, cfg);
        const lack = workRule(lv, cfg).work - w;
        line += `・工時 ${dur(w)}${lack > 0 ? `　<span class="late">不足 ${dur(lack)}</span>` : ''}`;
      }
      lines.push(line);
    } else if (first && k < todayKey) {
      lines.push('<span class="late">沒有下班紀錄</span>');
    }
    if (!first && !out && !lv) lines.push('沒有紀錄');
    box.innerHTML = lines.join('<br>');
    if (k <= todayKey) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'btn';
      b.textContent = '補登這天';
      b.addEventListener('click', () => openManual(k));
      box.appendChild(b);
    }
    box.hidden = false;
  }
  $('calPrev').addEventListener('click', () => {
    calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() - 1, 1);
    renderCalendar(calCtx);
  });
  $('calNext').addEventListener('click', () => {
    calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() + 1, 1);
    renderCalendar(calCtx);
  });

  let toastTimer;
  function toast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
  }

  $('punch').addEventListener('click', () => {
    const now = new Date();
    const k = dateKey(now);
    const records = load();
    const leaves = loadLeaves();
    const todayFirst = firstPerDay(records).get(k);
    const cfg = loadSettings();

    // 今天已經上班 → 這次是下班打卡
    if (todayFirst) {
      const outs = loadOuts();
      if (outs[k] && !confirm(`今天 ${hm(new Date(outs[k]))} 已經下班打卡，要更新成現在的時間嗎？`)) return;
      const need = earliestOff(todayFirst, leaves[k], cfg);
      if (now < need && !confirm(`還沒到最早下班時間 ${hm(need)}（還差 ${dur(Math.ceil((need - now) / 60000))}），確定要下班打卡嗎？`)) return;
      const m = loadManual();
      if (outs[k] && m.delete(outs[k])) saveManual(m);
      outs[k] = now.toISOString();
      saveOuts(outs);
      if (navigator.vibrate) navigator.vibrate(60);
      render();
      toast(`下班打卡 ${hm(now)}・工時 ${dur(workedMins(todayFirst, now, leaves[k], cfg))}`);
      return;
    }

    if (leaves[k] === 'full') {
      if (!confirm('今天登記了全天請假，要改成「上午請假」並打卡嗎？')) return;
      leaves[k] = 'am';
      saveLeaves(leaves);
    }
    records.push(now.toISOString());
    save(records);
    if (navigator.vibrate) navigator.vibrate(60);
    render();
    if (isLateDay(k, now, leaves, cfg)) {
      const n = monthLates(firstPerDay(records), leaves, cfg, k.slice(0, 7));
      toast(`打卡成功 ${hm(now)}・遲到（本月第 ${n} 次）`);
    } else {
      toast(`打卡成功 ${hms(now)}`);
    }
  });

  // 遲到規則設定
  const sdlg = $('settingsDlg');
  $('settingsBtn').addEventListener('click', () => {
    const cfg = loadSettings();
    $('setLateTime').value = cfg.lateTime;
    $('setLateLimit').value = cfg.lateLimit;
    $('setWorkHours').value = cfg.workHours;
    $('setLunchMins').value = cfg.lunchMins;
    sdlg.showModal();
  });
  sdlg.addEventListener('close', () => {
    if (sdlg.returnValue !== 'ok') return;
    const lateTime = $('setLateTime').value;
    const lateLimit = parseInt($('setLateLimit').value, 10);
    const workHours = parseFloat($('setWorkHours').value);
    const lunchMins = parseInt($('setLunchMins').value, 10);
    if (!lateTime || !(lateLimit > 0) || !(workHours > 0) || !(lunchMins >= 0)) return;
    saveSettings({ lateTime, lateLimit, workHours, lunchMins });
    render();
    toast('已儲存上下班規則');
  });

  // 手動打卡（忘記打卡時補登）
  const mdlg = $('manualDlg');
  const manualKind = () => mdlg.querySelector('input[name=mk]:checked').value;
  mdlg.querySelectorAll('input[name=mk]').forEach((r) => r.addEventListener('change', () => {
    $('manualTime').value = manualKind() === 'out' ? '18:00' : '08:30';
  }));
  // 已上班、還沒下班的日子 → 預設補登下班
  function openManual(k) {
    const kind = firstPerDay(load()).has(k) && !loadOuts()[k] ? 'out' : 'in';
    mdlg.querySelector(`input[name=mk][value=${kind}]`).checked = true;
    $('manualDate').value = k;
    $('manualDate').max = dateKey(new Date());
    $('manualTime').value = kind === 'out' ? '18:00' : '08:30';
    mdlg.showModal();
  }
  $('manualBtn').addEventListener('click', () => openManual(dateKey(new Date())));
  mdlg.addEventListener('close', () => {
    if (mdlg.returnValue !== 'ok') return;
    const k = $('manualDate').value;
    const t = $('manualTime').value;
    if (!k || !t) return;
    const d = new Date(`${k}T${t}:00`);
    if (isNaN(d)) return;
    if (d > new Date()) { toast('不能登記未來的時間'); return; }
    const s = d.toISOString();
    const label = `${k.slice(5).replace('-', '/')} ${t}`;

    if (manualKind() === 'out') {
      const first = firstPerDay(load()).get(k);
      if (first && d <= first) { toast(`下班時間要晚於上班時間 ${hm(first)}`); return; }
      const outs = loadOuts();
      if (outs[k] && !confirm(`${k} 已有下班紀錄 ${hm(new Date(outs[k]))}，要改成 ${t} 嗎？`)) return;
      const manual = loadManual();
      if (outs[k]) manual.delete(outs[k]);
      outs[k] = s;
      saveOuts(outs);
      manual.add(s);
      saveManual(manual);
      render();
      toast(`已補登下班 ${label}`);
      return;
    }

    const records = load();
    if (records.includes(s)) { toast('這筆紀錄已經存在'); return; }
    const leaves = loadLeaves();
    if (leaves[k] === 'full') {
      if (!confirm(`${k} 登記了全天請假，要改成「上午請假」並補登打卡嗎？`)) return;
      leaves[k] = 'am';
      saveLeaves(leaves);
    }
    records.push(s);
    save(records);
    const manual = loadManual();
    manual.add(s);
    saveManual(manual);
    render();
    toast(`已補登上班 ${label}`);
  });

  // 請假登記
  const dlg = $('leaveDlg');
  const setType = (t) => { dlg.querySelector(`input[name=lt][value=${t}]`).checked = true; };
  $('leaveDate').addEventListener('change', (e) => setType(loadLeaves()[e.target.value] || 'full'));
  $('leaveBtn').addEventListener('click', () => {
    const k = dateKey(new Date());
    $('leaveDate').value = k;
    setType(loadLeaves()[k] || 'full');
    dlg.showModal();
  });
  dlg.addEventListener('close', () => {
    if (dlg.returnValue !== 'ok') return;
    const k = $('leaveDate').value;
    const t = dlg.querySelector('input[name=lt]:checked').value;
    if (!k) return;
    const leaves = loadLeaves();
    leaves[k] = t;
    saveLeaves(leaves);
    render();
    toast(`已登記 ${k.slice(5).replace('-', '/')} ${LEAVE_LABEL[t]}請假`);
  });

  // 匯出 CSV（含 BOM，Excel 開啟中文不會亂碼）
  $('exportBtn').addEventListener('click', () => {
    const records = load();
    const leaves = loadLeaves();
    const manual = loadManual();
    const rows = [];
    for (const s of records) {
      const d = new Date(s);
      const type = manual.has(s) ? '打卡-手動' : '打卡';
      rows.push([`${dateKey(d)} ${hms(d)}`, `${dateKey(d)},週${WD[d.getDay()]},${hms(d)},${s},${type}`]);
    }
    for (const [k, t] of Object.entries(leaves)) {
      const d = new Date(k + 'T00:00');
      rows.push([`${k} 00`, `${k},週${WD[d.getDay()]},,,請假-${LEAVE_LABEL[t]}`]);
    }
    for (const s of Object.values(loadOuts())) {
      const d = new Date(s);
      const type = manual.has(s) ? '下班-手動' : '下班';
      rows.push([`${dateKey(d)} ${hms(d)}`, `${dateKey(d)},週${WD[d.getDay()]},${hms(d)},${s},${type}`]);
    }
    if (!rows.length) { toast('沒有資料可匯出'); return; }
    rows.sort((a, b) => (a[0] < b[0] ? -1 : 1));
    const lines = ['日期,星期,時間,ISO時間,類型', ...rows.map((r) => r[1])];
    const name = `打卡紀錄_${dateKey(new Date())}.csv`;
    const file = new File(['﻿' + lines.join('\r\n')], name, { type: 'text/csv;charset=utf-8' });

    // iPhone 主畫面 App 不支援一般下載，改用分享選單（可存到「檔案」、LINE、Email）
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: name })
        .then(() => toast(`已匯出 ${rows.length} 筆`))
        .catch((err) => { if (err.name !== 'AbortError') toast('分享失敗，請再試一次'); });
      return;
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(file);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    toast(`已匯出 ${rows.length} 筆`);
  });

  // 匯入 CSV（與現有資料合併，重複的會略過）
  const LABEL_TO_TYPE = Object.fromEntries(Object.entries(LEAVE_LABEL).map(([t, l]) => [l, t]));
  $('importBtn').addEventListener('click', () => $('importFile').click());
  $('importFile').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    e.target.value = '';
    if (!file) return;
    const text = (await file.text()).replace(/^﻿/, '');
    const set = new Set(load());
    const leaves = loadLeaves();
    const manual = loadManual();
    const outs = loadOuts();
    let added = 0, found = 0;
    for (const line of text.split(/\r?\n/).slice(1)) {
      const cols = line.split(',').map((c) => c.trim());
      if (cols.length < 3) continue;
      const date = cols[0].replace(/\//g, '-');
      const leaveType = (cols[4] || '').startsWith('請假') && LABEL_TO_TYPE[cols[4].split('-')[1]];
      if (leaveType) {
        found++;
        if (leaves[date] !== leaveType) { leaves[date] = leaveType; added++; }
        continue;
      }
      let d = cols[3] ? new Date(cols[3]) : null;
      if (!d || isNaN(d)) d = new Date(`${date}T${cols[2]}`);
      if (isNaN(d)) continue;
      found++;
      const s = d.toISOString();
      if ((cols[4] || '').startsWith('下班')) {
        if (outs[dateKey(d)] !== s) { outs[dateKey(d)] = s; added++; }
        if (cols[4] === '下班-手動') manual.add(s);
        continue;
      }
      if (!set.has(s)) { set.add(s); added++; }
      if (cols[4] === '打卡-手動') manual.add(s);
    }
    if (!found) { toast('檔案中找不到有效紀錄'); return; }
    save([...set]);
    saveLeaves(leaves);
    saveOuts(outs);
    saveManual(manual);
    render();
    toast(`匯入完成，新增 ${added} 筆`);
  });

  function tick() {
    const now = new Date();
    $('today').textContent = `${now.getFullYear()} 年 ${now.getMonth() + 1} 月 ${now.getDate()} 日　星期${WD[now.getDay()]}`;
    $('clock').textContent = hms(now);
  }
  let lastDay = dateKey(new Date());
  setInterval(() => {
    tick();
    const k = dateKey(new Date());
    if (k !== lastDay) { lastDay = k; render(); }
  }, 1000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { tick(); render(); } });

  tick();
  render();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
})();
</script>
</body>
</html>
